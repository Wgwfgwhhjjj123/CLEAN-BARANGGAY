<link rel="icon" type="image/png" sizes="192x192"
      href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="icon" type="image/png" sizes="32x32"
      href="{{ url_for('static', filename='icons/favicon-32.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" sizes="any">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<script src="{{ url_for('static', filename='js/theme_init.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/ux.css') }}">
<script src="{{ url_for('static', filename='js/shared_theme.js') }}" defer></script>

<style>
  /* BasuReport logo shown next to the name in headers and sidebars */
  .brand-logo { display:inline-block; width:34px; height:34px; flex:none; object-fit:contain;
                border-radius:50%; vertical-align:middle; margin-right:.4rem; }

  /* Large logo in the sign-in / sign-up side panels (replaces the small glass tile) */
  .left-panel .logo { width:auto !important; height:auto !important; padding:0 !important;
                      background:none !important; border:0 !important; box-shadow:none !important;
                      border-radius:0 !important; font-size:0 !important; line-height:0 !important;
                      display:flex !important; justify-content:center; align-items:center;
                      margin-bottom:22px !important; }
  .left-panel .logo .brand-logo { width:104px; height:104px; margin:0; background:#fff;
                      box-shadow:0 0 0 6px rgba(255,255,255,.22), 0 14px 34px rgba(0,0,0,.28); }
  @media (max-width:720px) {
    .left-panel .logo { margin-bottom:12px !important; }
    .left-panel .logo .brand-logo { width:72px; height:72px; }
  }
</style>
<script>
  /* Every page includes this file, so swap the old recycle-symbol text logo for the real
     logo image everywhere, including pages that were not edited by hand. */
  document.addEventListener('DOMContentLoaded', function () {
    var src = {{ url_for('static', filename='images/logo.png')|tojson }};
    document.querySelectorAll('.brand, .logo, .logo-mark').forEach(function (el) {
      if (el.querySelector('img.brand-logo')) return;
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      var node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue.indexOf('\u267B') === -1) continue;
        var img = document.createElement('img');
        img.className = 'brand-logo';
        img.src = src;
        img.alt = '';
        img.width = 34;
        img.height = 34;
        var rest = node.nodeValue.replace(/\u267B\uFE0F?/, '');
        if (!rest.trim() && node.parentNode === el && el.classList.contains('logo-mark')) {
          el.replaceWith(img);
        } else {
          node.nodeValue = rest.replace(/^\s+/, '');
          node.parentNode.insertBefore(img, node);
        }
        break;
      }
    });
  });
</script>
