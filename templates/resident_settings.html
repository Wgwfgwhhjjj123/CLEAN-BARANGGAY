<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e9e5b">
  <title>Settings | BasuReport</title>
  <script src="{{ url_for('static', filename='js/theme_init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/basu_ui.css') }}">
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#f1f6f2;color:#1c2a22;margin:0}
    html[data-theme="dark"] body{background:#141a17;color:#d5ddd8}
    .wrap{max-width:520px;margin:40px auto;padding:0 16px}
    .card{background:#fff;border-radius:16px;padding:24px;border:1px solid #dfe8e2}
    html[data-theme="dark"] .card{background:#1c2420;border-color:#28332d}
    .row{display:flex;justify-content:space-between;align-items:center;gap:16px}
    small{opacity:.7}
    a{color:#2e9d5b;text-decoration:none}
    #theme-toggle-setting{background:#2e9d5b;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
    html[data-theme="dark"] #theme-toggle-setting{background:#46a873;color:#0f1713}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="{{ url_for('resident_home') }}">← Back to Home</a></p>
    <h1>Settings</h1>
    <div class="card">
      <div class="row">
        <div><b>Appearance</b><br><small>Switch between day and night</small></div>
        <!-- shared_theme.js already controls any button with this id -->
        <button type="button" id="theme-toggle-setting">Use dark mode</button>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/shared_theme.js') }}"></script>
</body>
</html>
